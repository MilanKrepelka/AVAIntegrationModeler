name: .NET Build and Publish

on:
  push:
    tags:
      - 'v*'   # např. v1.0.0
  workflow_dispatch:

permissions:
  contents: write   # nutné pro upload do release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # uprav dle projektu

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Create ZIP
        run: |
          cd publish
          zip -r ../AVAIntegrationModeler.zip .

      - name: Create Release (if missing) and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automated release $TAG"
          gh release upload "$TAG" AVAIntegrationModeler.zip --clobber
