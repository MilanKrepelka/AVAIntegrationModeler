name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: |
          dotnet publish .\AVAIntegrationModeler\src\AVAIntegrationModeler.API\AVAIntegrationModeler.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o .\publish\API

      - name: Publish Web Syncfusion App
        run: |
          dotnet publish .\AVAIntegrationModeler\src\AVAIntegrationModeler.Web.SyncfusionApp\AVAIntegrationModeler.Web.SyncfusionApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o .\publish\Web.SyncfusionApp

      - name: Create ZIP
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Compress-Archive `
            -Path .\publish\* `
            -DestinationPath .\dist\AVAIntegrationModeler-win-x64.zip `
            -Force

      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_ref="refs/tags/${{ inputs.tag }}"
          if git ls-remote --exit-code --tags origin "$tag_ref" >/dev/null 2>&1; then
            echo "Tag '${{ inputs.tag }}' exists; skipping creation."
          else
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          fi

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: dist/AVAIntegrationModeler-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
